---
# VLAN interfaces, hostnames, /etc/hosts, sudo. One node at a time.
# (No packages here: the other nodes only get Internet once 02-gateway-dns.yml has run.)
#   ansible-playbook 01-network.yml -K
# Needs the switch VLANs (switch/switch-vlans.md) configured first.
- name: Network on every node
  hosts: all
  serial: 1
  become: true
  tasks:
    - name: Hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: NIC exists on the node
      ansible.builtin.include_tasks: tasks/check_nic.yml

    - name: Current default routes
      ansible.builtin.include_tasks: tasks/check_default_route.yml

    - name: Refuse to create a second default route
      ansible.builtin.assert:
        that: defroutes.stdout == '' or gateway_egress_ip in defroutes.stdout or (allow_other_default | default(false) | bool)
        fail_msg: >-
          This node already has a default route ({{ defroutes.stdout }}). Remove it from the existing netplan
          file (the lab default route goes via {{ gateway_egress_ip }}) or re-run with -e allow_other_default=true
      when: inventory_hostname not in groups['gateway']

    - name: Passwordless sudo for Kolla-Ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-kolla-ansible
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Remove the 127.0.1.1 hostname alias (cluster names must resolve to real IPs)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent

    - name: Cluster names in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} cloud03 lab"
        block: "{{ lookup('ansible.builtin.template', 'hosts.j2') }}"

    - name: Find netplan files that do not define the NIC
      ansible.builtin.shell: |
        for f in /etc/netplan/*.yaml /etc/netplan/*.yml; do
          [ -e "$f" ] || continue
          b=$(basename "$f")
          [ "$b" = "01-network-manager-all.yaml" ] && continue
          [ "$b" = "60-cloud03-vlans.yaml" ] && continue
          if ! grep -q -- "{{ nic }}" "$f"; then
            printf '%s\n' "$f"
          fi
        done
      register: stray_netplans
      changed_when: false

    - name: Remove netplan files that do not define the NIC
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ stray_netplans.stdout_lines }}"
      when: stray_netplans.stdout_lines | length > 0

    - name: Check whether the NIC is defined outside cloud-init
      ansible.builtin.shell: |
        found=0
        for f in /etc/netplan/*.yaml /etc/netplan/*.yml; do
          [ -e "$f" ] || continue
          b=$(basename "$f")
          [ "$b" = "50-cloud-init.yaml" ] && continue
          [ "$b" = "01-network-manager-all.yaml" ] && continue
          [ "$b" = "60-cloud03-vlans.yaml" ] && continue
          if grep -q -- "{{ nic }}" "$f"; then
            found=1
            break
          fi
        done
        echo "$found"
      register: nic_defined_elsewhere
      changed_when: false

    - name: Remove cloud-init netplan when the NIC is defined elsewhere
      ansible.builtin.file:
        path: /etc/netplan/50-cloud-init.yaml
        state: absent
      when: nic_defined_elsewhere.stdout | trim == "1"

    - name: Secure base netplan permissions
      ansible.builtin.file:
        path: /etc/netplan/01-network-manager-all.yaml
        mode: "0600"

    - name: VLAN netplan file
      ansible.builtin.template:
        src: netplan.yaml.j2
        dest: /etc/netplan/60-cloud03-vlans.yaml
        mode: "0600"
      register: netplan

    - name: Check whether VLAN interfaces already exist
      ansible.builtin.command: ip -br link show mgmt
      register: vlan_interfaces
      failed_when: false
      changed_when: false

    - name: Validate netplan
      ansible.builtin.command: netplan generate
      when: netplan.changed or vlan_interfaces.rc != 0

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      when: netplan.changed or vlan_interfaces.rc != 0

    - name: Wait for the node
      ansible.builtin.wait_for_connection:
        delay: 3
        timeout: 120
      when: netplan.changed or vlan_interfaces.rc != 0

    - name: All VLAN interfaces are up
      ansible.builtin.command: ip -br link show {{ item }}
      loop: "{{ ['mgmt','storage','tunnel','egress','provider','dns'] + (['api'] if inventory_hostname in groups['control'] else []) }}"
      changed_when: false
