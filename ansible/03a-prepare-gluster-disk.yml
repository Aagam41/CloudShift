---
# Interactive preparation of a dedicated disk for GlusterFS.
# Run before site.yml:  ansible-playbook 03a-prepare-gluster-disk.yml -K
- name: Prepare a dedicated disk for GlusterFS
  hosts: control
  serial: 1
  become: true
  tasks:
    - name: List available block devices
      ansible.builtin.command: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,MODEL
      register: lsblk_out
      changed_when: false

    - name: List free/unallocated space
      ansible.builtin.command: parted -l
      register: parted_out
      changed_when: false
      failed_when: false

    - name: Show device candidates
      ansible.builtin.debug:
        msg: "{{ lsblk_out.stdout_lines + parted_out.stdout_lines }}"

    - name: Check if /srv/gluster is already mounted
      ansible.builtin.command: findmnt -n -o SOURCE --target /srv/gluster
      register: gluster_mount
      failed_when: false
      changed_when: false

    - name: Store mounted device
      ansible.builtin.set_fact:
        mounted_device: "{{ gluster_mount.stdout | trim }}"
      when: gluster_mount.rc == 0

    - name: Detect unmounted partitions
      ansible.builtin.shell: |
        lsblk -r -n -o NAME,TYPE,MOUNTPOINT | awk '$2=="part" && $3=="" {print "/dev/" $1}'
      register: detected_parts
      changed_when: false

    - name: Store detected device
      ansible.builtin.set_fact:
        detected_disk: "{{ detected_parts.stdout_lines[0] | default('') }}"

    - name: Determine disk mode
      ansible.builtin.set_fact:
        disk_mode: >-
          {{ 'mounted' if (mounted_device | default('') | length > 0)
             else ('unmounted' if (detected_disk | default('') | length > 0)
             else 'none') }}

    - name: Show detected mode
      ansible.builtin.debug:
        msg: "Mode: {{ disk_mode }}; mounted={{ mounted_device | default('none') }}; detected={{ detected_disk | default('none') }}"

    # ---------- mounted case ----------
    - name: Prompt for mounted device action
      ansible.builtin.pause:
        prompt: "Device {{ mounted_device }} is mounted at /srv/gluster. Type FORMAT to reformat it, or SKIP to keep it"
      register: mounted_action
      when: disk_mode == 'mounted'

    - name: Skip host if keeping mounted device
      ansible.builtin.meta: end_host
      when: disk_mode == 'mounted' and (mounted_action.user_input | trim) != 'FORMAT'

    - name: Mark mounted device for format
      ansible.builtin.set_fact:
        gluster_disk: "{{ mounted_device }}"
        format_needed: true
      when: disk_mode == 'mounted' and (mounted_action.user_input | trim) == 'FORMAT'

    # ---------- unmounted case ----------
    - name: Prompt for unmounted device
      ansible.builtin.pause:
        prompt: "Enter device (blank to use detected: {{ detected_disk if detected_disk else 'none' }}, or 'skip')"
      register: device_prompt
      when: disk_mode == 'unmounted'

    - name: Resolve selected unmounted device
      ansible.builtin.set_fact:
        gluster_disk: "{{ device_prompt.user_input | trim if (device_prompt.user_input | trim not in ['', 'skip']) else (detected_disk if (device_prompt.user_input | trim == '' and detected_disk | default('') | length > 0) else '') }}"
        format_needed: true
      when: disk_mode == 'unmounted'

    - name: Skip host if no unmounted device selected
      ansible.builtin.meta: end_host
      when: disk_mode == 'unmounted' and (gluster_disk | default('') | trim == '')

    # ---------- none case ----------
    - name: Read dedicated disk setting from deploy host
      ansible.builtin.shell: |
        grep -E '^gluster_require_dedicated_disk:' group_vars/all.yml | awk '{print $2}'
      delegate_to: localhost
      register: dedicated_setting
      changed_when: false
      when: disk_mode == 'none'

    - name: Fail if dedicated disk is required but none was found
      ansible.builtin.fail:
        msg: "No unmounted partition found, but gluster_require_dedicated_disk is true. Add a disk or set it to false."
      when: disk_mode == 'none' and (dedicated_setting.stdout | trim) == 'true'

    - name: Prompt to use root filesystem
      ansible.builtin.pause:
        prompt: "No unmounted partition found. Use /srv/gluster on root filesystem? Type YES to continue, or SKIP"
      register: root_prompt
      when: disk_mode == 'none' and (dedicated_setting.stdout | trim) != 'true'

    - name: Skip host if root filesystem not accepted
      ansible.builtin.meta: end_host
      when: disk_mode == 'none' and (dedicated_setting.stdout | trim) != 'true' and (root_prompt.user_input | trim) != 'YES'

    - name: Mark root filesystem mode
      ansible.builtin.set_fact:
        use_root: true
      when: disk_mode == 'none' and (dedicated_setting.stdout | trim) != 'true' and (root_prompt.user_input | trim) == 'YES'

    # ---------- common safety checks ----------
    - name: Skip host if no disk selected and not using root
      ansible.builtin.meta: end_host
      when: (gluster_disk | default('') | trim == '') and not (use_root | default(false))

    - name: Confirm destructive format
      ansible.builtin.pause:
        prompt: "Type YES to format {{ gluster_disk }}"
      register: confirm_prompt
      when: format_needed | default(false)

    - name: Require explicit YES confirmation for format
      ansible.builtin.assert:
        that: confirm_prompt.user_input == "YES"
        fail_msg: "Aborted: confirmation was not YES"
      when: format_needed | default(false)

    # ---------- format path ----------
    - name: Unmount existing /srv/gluster before format
      ansible.builtin.command: umount /srv/gluster
      when: format_needed | default(false) and (mounted_device | default('') | length > 0)
      failed_when: false
      changed_when: false

    - name: Device must exist
      ansible.builtin.stat:
        path: "{{ gluster_disk }}"
      register: disk_stat
      failed_when: not disk_stat.stat.exists
      when: format_needed | default(false)

    - name: Device must not already be mounted
      ansible.builtin.command: findmnt -n "{{ gluster_disk }}"
      register: mounted_check
      failed_when: mounted_check.rc == 0
      changed_when: false
      when: format_needed | default(false)

    - name: Format the partition as XFS
      ansible.builtin.command: mkfs.xfs -f {{ gluster_disk }}
      when: format_needed | default(false)

    - name: Create mount point
      ansible.builtin.file:
        path: /srv/gluster
        state: directory
        mode: "0755"

    - name: Mount the partition persistently
      ansible.builtin.mount:
        path: /srv/gluster
        src: "{{ gluster_disk }}"
        fstype: xfs
        opts: defaults
        dump: 0
        passno: 0
        state: mounted
      when: format_needed | default(false)

    # ---------- root filesystem path ----------
    - name: Ensure /srv/gluster exists on root filesystem
      ansible.builtin.file:
        path: /srv/gluster
        state: directory
        mode: "0755"
      when: use_root | default(false)