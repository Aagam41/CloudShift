---
# Read-only checks. Run first:   ansible-playbook 00-preflight.yml -K
- name: Create Ansible user on all Ubuntu servers
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    ansible_username: ansible
    ansible_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Create ansible user
      ansible.builtin.user:
        name: "{{ ansible_username }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes
        state: present

    - name: Create SSH directory
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: '0700'

    - name: Add SSH public key
      ansible.builtin.authorized_key:
        user: ansible
        key: "{{ ansible_public_key }}"
        state: present

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Verify ansible user sudo access
      ansible.builtin.command: sudo -n whoami
      become: yes
      become_user: ansible
      changed_when: false
      register: sudo_test

    - name: Display server result
      ansible.builtin.debug:
        msg: "Ansible user successfully configured. Sudo result: {{ sudo_test.stdout }}"
