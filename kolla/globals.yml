---
# Verified against the kolla-ansible 23.0.0 defaults. Same file for all nodes: interface
# names are identical everywhere because ansible/01-network.yml names the VLAN interfaces.
kolla_base_distro: "ubuntu"
openstack_release: "2026.1"            # install.sh overwrites this from $RELEASE

# ---- Networks ----
network_interface: "mgmt"              # VLAN 10: API, RabbitMQ, MariaDB, live-migration traffic
tunnel_interface: "tunnel"             # VLAN 30: VXLAN tenant networks
neutron_external_interface: "provider" # VLAN 60: br-ex, must have no IP (flat network "physnet1")
enable_neutron_provider_networks: "yes"
# (VLAN 20 "storage" carries only GlusterFS traffic, Kolla does not need to know about it)

# ---- High availability: HAProxy + Keepalived on the 3 controllers ----
kolla_internal_vip_address: "10.0.10.100"      # on VLAN 10, must be unused
kolla_external_vip_address: "10.14.40.100"     # on VLAN 40, must be unused
kolla_external_vip_interface: "api"            # VLAN 40 exists on the controllers only

# ---- Compute / live migration ----
nova_compute_virt_type: "kvm"                  # "qemu" only if a node has no VT-x/AMD-V

# ---- Shared storage: GlusterFS volumes (3 copies, one per controller) mounted by ansible/03-storage.yml ----
nova_instance_datadir_volume: "/var/lib/nova-shared"       # VM disks, mounted on every compute node
glance_file_datadir_volume: "/var/lib/glance-shared"       # images: a shared path makes Kolla run glance-api on all 3 controllers
gnocchi_metric_datadir_volume: "/var/lib/gnocchi-shared"   # telemetry data, shared by the 3 Gnocchi nodes
enable_valkey: "yes"                                       # coordination between the 3 Gnocchi / Ceilometer nodes

# ---- Block storage: not enabled (no shared backend decided, see README) ----
enable_cinder: "no"

# ---- Telemetry + billing: Ceilometer -> Gnocchi -> CloudKitty, all on the 3 controllers (CloudKitty stores in MariaDB) ----
enable_ceilometer: "yes"
enable_gnocchi: "yes"
enable_cloudkitty: "yes"

# ---- Metrics + dashboards: Prometheus + Grafana ----
# One Prometheus per controller (HAProxy sends queries to one, the others are hot standbys: Kolla's default
# prometheus_active_passive), Grafana on all 3 (its state is in MariaDB), clustered Alertmanager.
# Node, libvirt, OpenStack, cAdvisor, MariaDB, HAProxy and Memcached exporters switch on by default with Prometheus.
enable_prometheus: "yes"
enable_grafana: "yes"
prometheus_scrape_interval: "15s"
prometheus_cmdline_extras: "--storage.tsdb.retention.time=30d"
