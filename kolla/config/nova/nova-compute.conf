[libvirt]
# Every compute node must present the same CPU model to guests, otherwise live migration
# between different CPUs is refused. "Nehalem" works on any Intel/AMD CPU from ~2009 on.
# Check your nodes first:  scripts/cpu-check.sh
# If a node is older, use "qemu64" (always works, slower, no SSE4/AVX for guests).
# If all six machines have the identical CPU you can use instead:  cpu_mode = host-passthrough
cpu_mode = custom
cpu_models = Nehalem
