# Extra scrape job for the cloud-exporter that runs on the same controller as this Prometheus.
# Kolla renders this file once per host, so the target below resolves to each controller's own
# management address (network_interface is "mgmt" in globals.yml).
scrape_configs:
  - job_name: cloud_exporter
    scrape_interval: 30s
    static_configs:
      - targets:
          - "{{ hostvars[inventory_hostname]['ansible_' + network_interface]['ipv4']['address'] }}:9199"
