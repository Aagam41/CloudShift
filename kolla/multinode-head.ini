# Our hosts. install.sh puts this on top of Kolla's stock inventory (all the service groups).
# Host names must resolve (ansible/01-network.yml writes /etc/hosts) and match `hostname`.
# Keep this file in sync with ansible/inventory.yml; install.sh validates it before deploying.

[control]
cloud03-controller01

[network]
cloud03-controller01

[compute]
cloud03-compute01
cloud03-compute02
cloud03-compute03

# Prometheus, Grafana, Alertmanager: on the controller.
# (Ceilometer, Gnocchi, CloudKitty, Glance and Valkey already default to the [control] group in Kolla's inventory.)
[monitoring]
cloud03-controller01

[storage]
cloud03-controller01

[deployment]
localhost ansible_connection=local

[baremetal:vars]
ansible_user=ansible
ansible_become=true
