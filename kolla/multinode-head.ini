# Our hosts. install.sh puts this on top of Kolla's stock inventory (all the service groups).
# Host names must resolve (ansible/01-network.yml writes /etc/hosts) and match `hostname`.

[control]
cloud03-contorller01
cloud03-contorller02
cloud03-contorlcompute

[network]
cloud03-contorller01
cloud03-contorller02
cloud03-contorlcompute

[compute]
cloud03-contorlcompute
cloud03-compute01
cloud03-compute02
cloud03-compute03
cloud03-compute04
cloud03-compute05

# Prometheus, Grafana, Alertmanager: on all three controllers, so none of them is special.
# (Ceilometer, Gnocchi, CloudKitty, Glance and Valkey already default to the [control] group in Kolla's inventory.)
[monitoring]
cloud03-contorller01
cloud03-contorller02
cloud03-contorlcompute

[storage]
cloud03-contorller01
cloud03-contorller02
cloud03-contorlcompute

[deployment]
localhost ansible_connection=local

[baremetal:vars]
ansible_user=ubuntu
ansible_become=true

